
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小宇的个人主页</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            background: #fff;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            animation: show 1s ease;
        }

        @keyframes show {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            border-radius: 50%;
            background: #667eea;
            color: #fff;
            font-size: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
            color: #333;
            font-size: 26px;
        }

        p {
            margin: 15px 0;
            color: #666;
            line-height: 1.8;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: #667eea;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button:focus-visible {
            outline: 3px solid #333;
            outline-offset: 4px;
        }

        @media (max-width: 400px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="avatar">小</div>

        <h1>你好，我是小宇</h1>

        <p>
            牛逼用你说？<br>
            这是我的第一个网页。
        </p>

        <button type="button" onclick="hello()">
            点我一下
        </button>
    </main>

    <script>
        function hello() {
            alert("余志城你是人机吧！");
        }
    </script>
</body>
</html>
